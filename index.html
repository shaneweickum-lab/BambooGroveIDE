<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BambooGrove IDE</title>
  <link rel="icon" type="image/svg+xml" href="assets/bamboo-script-icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <img class="brand-icon" src="assets/bamboo-script-icon.svg" alt="" width="28" height="28" />
        <span class="brand-name">BambooGrove</span>
      </div>

      <div class="file-controls">
        <input id="filename" class="filename-input" value="main.bs" spellcheck="false" aria-label="Sketch file name" />
        <button id="btn-new" class="btn" title="New sketch">New</button>
        <button id="btn-save" class="btn" title="Save (Ctrl/Cmd+S)">Save</button>
        <button id="btn-save-as" class="btn" title="Save a copy and download the .bs file">Save As</button>
        <button id="btn-open" class="btn" title="Open a .bs file from disk">Open</button>
        <input id="file-upload" type="file" accept=".bs,text/plain" hidden />
        <button id="btn-rename" class="btn" title="Rename this saved sketch">Rename</button>
        <button id="btn-delete" class="btn btn-danger" title="Delete this saved sketch">Delete</button>
      </div>

      <div class="run-controls">
        <button id="btn-run" class="btn btn-primary" title="Run (Ctrl/Cmd+Enter)">▶ Run</button>
        <button id="btn-stop" class="btn" title="Stop">■ Stop</button>
      </div>
    </header>

    <div class="status-bar" id="status" role="status"></div>

    <div class="main">
      <aside class="sidebar">
        <h2>My Sketches</h2>
        <ul id="file-list" class="file-list"></ul>
      </aside>

      <section class="editor-pane">
        <div class="editor-gutter" id="gutter" aria-hidden="true">1</div>
        <div class="editor-surface">
          <pre class="editor-highlight" id="highlight" aria-hidden="true"><code id="highlight-code"></code></pre>
          <textarea
            id="code"
            class="editor-input"
            spellcheck="false"
            autocapitalize="off"
            autocomplete="off"
            autocorrect="off"
            wrap="off"
          ></textarea>
        </div>
      </section>

      <section class="canvas-pane">
        <canvas id="canvas" width="480" height="480"></canvas>
        <div id="error-console" class="error-console" hidden></div>
      </section>
    </div>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
